x-ambiente: &ambiente
  DATABASE_URL: postgres://automacao:${POSTGRES_PASSWORD}@postgres:5432/automacao
  REDIS_URL: redis://redis:6379
  FILES_DIRS: ${FILES_DIRS:-/files}

services:
  # Telas, API, webhooks, formulários e gatilhos.
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *ambiente
      # As execuções rodam no serviço worker: um fluxo pesado não deixa a tela lenta para todo mundo.
      RUN_WORKER_IN_PROCESS: "false"
    volumes:
      # Pasta para os nós Read/Write Files from Disk (dentro do Info8n ela é /files).
      - ./arquivos:/files
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Roda as execuções dos fluxos (até WORKER_CONCURRENCY ao mesmo tempo).
  worker:
    build: .
    command: ["node", "apps/server/dist/worker-main.js"]
    restart: unless-stopped
    env_file: .env
    environment: *ambiente
    volumes:
      - ./arquivos:/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: automacao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: automacao
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automacao"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
