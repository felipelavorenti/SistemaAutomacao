name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: automacao_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Teste_Forte_123
        ports: ["1433:1433"]
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: Teste_Forte_123
          APP_USER: teste
          APP_USER_PASSWORD: Teste_Forte_123
        ports: ["1521:1521"]
      metabase:
        image: metabase/metabase:latest
        ports: ["3001:3000"]
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/automacao_test
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_MSSQL_HOST: localhost
      TEST_MSSQL_PASSWORD: Teste_Forte_123
      TEST_ORACLE_CONNECT: localhost:1521/FREEPDB1
      TEST_ORACLE_USER: teste
      TEST_ORACLE_PASSWORD: Teste_Forte_123
      TEST_METABASE_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sistema-automacao .
